<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-dasharray="16 12" opacity="0.3" />
  
  <!-- Friendly Joy Sun -->
  <g filter="url(#shadow)">
    <!-- Sun Rays -->
    <path d="M256 70 L256 100 M256 412 L256 442 M70 256 L100 256 M412 256 L442 256 M125 125 L146 146 M366 366 L387 387 M125 387 L146 366 M366 146 L387 125" stroke="#FDE047" stroke-width="14" stroke-linecap="round" />
    
    <!-- Sun Body -->
    <circle cx="256" cy="256" r="115" fill="url(#sunGrad)"/>
    
    <!-- Joyful Eyes -->
    <ellipse cx="215" cy="235" rx="12" ry="16" fill="#1E1B4B" />
    <circle cx="219" cy="229" r="4" fill="#FFFFFF" />
    <ellipse cx="297" cy="235" rx="12" ry="16" fill="#1E1B4B" />
    <circle cx="301" cy="229" r="4" fill="#FFFFFF" />
    
    <!-- Rosy Cheeks -->
    <ellipse cx="195" cy="255" rx="14" ry="9" fill="#FB7185" opacity="0.75" />
    <ellipse cx="317" cy="255" rx="14" ry="9" fill="#FB7185" opacity="0.75" />
    
    <!-- Big Smile -->
    <path d="M218 268 Q256 312 294 268" fill="none" stroke="#1E1B4B" stroke-width="10" stroke-linecap="round" />
    
    <!-- Little Dove / Sparkle Badge -->
    <circle cx="335" cy="175" r="32" fill="#FFFFFF" />
    <path d="M335 160 L338 170 L348 172 L340 178 L342 188 L335 182 L328 188 L330 178 L322 172 L332 170 Z" fill="#F59E0B" />
  </g>
  
  <!-- Peaceful rainbow curve at the bottom -->
  <path d="M120 440 Q256 380 392 440" fill="none" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <path d="M140 455 Q256 400 372 455" fill="none" stroke="#4ADE80" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
</svg>
